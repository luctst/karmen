# Karmen — local case-study compose stack.
#
# Services:
#   db      -> Postgres 16 (named volume, healthcheck)
#   migrate -> one-shot: `prisma migrate deploy && prisma db seed` (runs once,
#              after db is healthy, then exits)
#   api     -> NestJS (Prisma), published on the host
#   web     -> React/Vite build served by `vite preview`, published on the host
#
# LOCAL-ONLY: no nginx, no reverse proxy, no registry, single-arch. web and api
# are SEPARATE origins; the SPA calls the API via VITE_API_BASE_URL (its
# published host port). The API must enable CORS for the web origin.
#
# For local hot-reload dev, copy docker-compose.override.yml.example ->
# docker-compose.override.yml; compose auto-merges it (the override is gitignored).
#
# No top-level `version:` key (ignored by Compose v2).
#
# Run:   docker compose up --build       (config via .env — see .env.example)
#
# Topology (host ports shown):
#
#   browser --> localhost:${WEB_PORT}  ->  web  (vite preview :4173)
#   browser --> localhost:${API_PORT}  ->  api  (nest :3000)  --> db (:5432)
#                                                                   ^
#                                              migrate (one-shot) --+
#   All services share karmen-net (DNS by service name).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Discrete vars are the SOURCE OF TRUTH for the DB connection.
      POSTGRES_USER: ${PGUSER:-karmen}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      POSTGRES_DB: ${PGDATABASE:-karmen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-karmen} -d ${PGDATABASE:-karmen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - karmen-net

  migrate:
    build:
      context: .                       # repo root — needed for workspace npm ci
      dockerfile: packages/api/Dockerfile
      target: migrate
    environment:
      # Prisma reads DATABASE_URL. Assembled from the discrete PG* vars above
      # (which remain the source of truth). `db` is the in-network hostname.
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-karmen}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-karmen}
      DATABASE_URL: postgres://${PGUSER:-karmen}:${PGPASSWORD}@db:5432/${PGDATABASE:-karmen}?schema=public
    depends_on:
      db:
        condition: service_healthy     # wait for Postgres readiness
    restart: "no"                       # one-shot: run migrations + seed, then exit
    networks:
      - karmen-net

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Discrete PG* vars (source of truth) + assembled DATABASE_URL for Prisma.
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-karmen}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-karmen}
      DATABASE_URL: postgres://${PGUSER:-karmen}:${PGPASSWORD}@db:5432/${PGDATABASE:-karmen}?schema=public
      # Allow the web origin to call the API (no reverse proxy). The app should
      # read this and configure CORS accordingly.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully  # start only after seed done
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - "${API_PORT:-3000}:3000"        # published: the SPA calls this origin
    networks:
      - karmen-net

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: runtime
      args:
        # Vite inlines this at build time. Points at the API's published origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:4173"        # host WEB_PORT -> vite preview :4173
    networks:
      - karmen-net

volumes:
  pgdata:
    # Docker-managed named volume. Persists Postgres data across container
    # recreation. Remove with `docker compose down -v` (destroys data + reseeds
    # on next up, since the seed is keyed off an empty DB).

networks:
  karmen-net:
    driver: bridge                     # user-defined bridge -> DNS by service name
