# Karmen local stack: web + api published; db internal; migrate runs once then exits.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-karmen}
      POSTGRES_PASSWORD: ${PGPASSWORD:?PGPASSWORD is required}
      POSTGRES_DB: ${PGDATABASE:-karmen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-karmen} -d ${PGDATABASE:-karmen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - karmen-net

  migrate:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: migrate
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-karmen}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-karmen}
      DATABASE_URL: postgres://${PGUSER:-karmen}:${PGPASSWORD}@db:5432/${PGDATABASE:-karmen}?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - karmen-net

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-karmen}
      PGPASSWORD: ${PGPASSWORD}
      PGDATABASE: ${PGDATABASE:-karmen}
      DATABASE_URL: postgres://${PGUSER:-karmen}:${PGPASSWORD}@db:5432/${PGDATABASE:-karmen}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - karmen-net

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: runtime
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:4173"
    networks:
      - karmen-net

volumes:
  pgdata:

networks:
  karmen-net:
    driver: bridge
